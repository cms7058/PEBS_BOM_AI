[project]
name = "pebs-bom-api"
version = "0.0.1"
description = "PEBS BOM API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "alembic>=1.14.0",
  "anthropic>=0.39.0",
  "openai>=1.50.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "python-multipart>=0.0.12",
  "minio>=7.2.10",
  "sse-starlette>=2.1.3",
  "orjson>=3.10.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
